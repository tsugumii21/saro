# SARO Supabase local configuration.
# `project_id` is a local-only label; `supabase link` writes the real project
# ref into supabase/.temp/, which is gitignored.

project_id = "saro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Report photos are compressed to ~1280px JPEG client-side before upload.
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Staff accounts are provisioned by an administrator, never self-registered.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.gemini-proxy]
# The resident app calls this anonymously, so no JWT is required.
# Abuse control is per-device rate limiting inside the function.
verify_jwt = false
