# SARO Supabase local configuration.
# `project_id` is a local-only label; `supabase link` writes the real project
# ref into supabase/.temp/, which is gitignored.

project_id = "saro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Report photos are compressed to ~1280px JPEG client-side before upload.
file_size_limit = "10MiB"

[auth]
enabled = true
# Residents are the public-facing signup, so confirmation mail returns there.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Public signup is ON, and it can only ever produce a resident: the
# handle_new_user trigger hard-codes role='resident' and ignores whatever the
# client sent in user_metadata. Staff roles are assignable only by an admin or
# by supabase/scripts/create-staff-users.mjs, both of which go through the
# service role. See migration 02.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Residents must confirm their address before the account works. Without this,
# anyone could register someone else's email and receive their report updates.
enable_confirmations = true

# Custom SMTP via Gmail.
#
# Supabase's built-in email service only delivers to members of the project
# team, which is why resident self-signup returned "Email address is invalid"
# for every outside address. Any working SMTP server fixes it; Gmail is the one
# available here.
#
# Two Gmail specifics that are not optional:
#   1. `pass` must be a Google App Password (16 characters, no spaces), not the
#      account password. App Passwords only exist once 2-Step Verification is
#      switched on for the account.
#   2. Gmail rewrites the From header to the authenticated mailbox, so
#      `sender_name`'s address and `user` must be the same mailbox. Setting a
#      different sender address does not work — Gmail silently overrides it.
#
# The password is read from the environment at `supabase config push` time and
# is never written to this file. See the SMTP section of README.md.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(SARO_SMTP_USER)"
pass = "env(SARO_SMTP_PASSWORD)"
admin_email = "env(SARO_SMTP_USER)"
sender_name = "SARO Legazpi"

# Gmail's free tier allows roughly 500 recipients a day and throttles well
# before that per hour, so this sits deliberately under it. The default of 2 an
# hour is a built-in-service limit and is far too low for a launch day; 30 is
# enough for real signups without handing an abuser a way to burn the daily
# quota and lock out everyone else.
[auth.rate_limit]
email_sent = 30

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.gemini-proxy]
# The resident app calls this anonymously, so no JWT is required.
# Abuse control is per-device rate limiting inside the function.
verify_jwt = false
